name: Build Bellic from uploaded source ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Bellic and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive exists
        run: test -f Bellic-Android-Project.zip

      - name: Extract Android project
        run: |
          mkdir -p .bellic-build
          unzip -q Bellic-Android-Project.zip -d .bellic-build
          test -f .bellic-build/Bellic/settings.gradle.kts
          test -f .bellic-build/Bellic/app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p .bellic-build/Bellic clean assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bellic-debug-APK
          path: .bellic-build/Bellic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
